<style>

/* RESET */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* BODY */

body{
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#0b0b10;
  color:white;

  padding:20px;

  overflow-x:hidden;
}

/* FUNDO */

.bg{
  position:fixed;
  inset:0;

  background:
  radial-gradient(circle at top left,#7c3aed55,transparent 35%),
  radial-gradient(circle at bottom right,#06b6d455,transparent 35%),
  linear-gradient(180deg,#050510,#111827);

  z-index:-1;
}

/* CONTAINER */

.container{
  width:92%;
  max-width:420px;

  z-index:2;

  animation:fade 0.8s ease;
}

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* PERFIL */

.profile{
  text-align:center;
  margin-bottom:34px;
}

/* FOTO PERFIL */

.avatar{
  width:125px;
  height:125px;

  margin:auto;

  border-radius:50%;

  object-fit:cover;

  border:3px solid rgba(124,58,237,0.8);

  box-shadow:
  0 0 25px rgba(124,58,237,0.45),
  0 0 60px rgba(6,182,212,0.15);

  animation:float 4s ease-in-out infinite;
}

@keyframes float{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-8px);
  }

  100%{
    transform:translateY(0px);
  }

}

/* TEXTO PERFIL */

.profile h1{
  font-size:42px;
  margin-top:14px;
  font-weight:700;

  letter-spacing:-1px;
}

.profile p{
  color:#b8b8b8;
  font-size:15px;
  font-weight:300;

  margin-top:2px;
}

/* CARDS */

.card{
  position:relative;

  display:flex;
  align-items:center;
  gap:16px;

  padding:16px 18px;
  margin-bottom:14px;

  border-radius:20px;

  background:rgba(255,255,255,0.06);

  border:1px solid rgba(255,255,255,0.08);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  text-decoration:none;
  color:white;

  overflow:hidden;

  transition:0.25s ease;
}

/* HOVER */

.card:hover{
  transform:translateY(-4px) scale(1.02);

  background:rgba(255,255,255,0.10);

  border:1px solid rgba(124,58,237,0.5);

  box-shadow:
  0 0 25px rgba(124,58,237,0.25);
}

/* BRILHO */

.card::before{
  content:"";

  position:absolute;
  top:0;
  left:-100%;

  width:100%;
  height:100%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.08),
    transparent
  );

  transition:0.7s;
}

.card:hover::before{
  left:100%;
}

/* SETA */

.card::after{
  content:"↗";

  margin-left:auto;

  font-size:18px;

  opacity:0.7;
}

/* QUADRADO DOS ÍCONES */

.icon-box{
  width:58px;
  height:58px;

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

/* ÍCONES */

.icon{
  font-size:26px;
  color:white;
}

/* LIVEPIX */

.livepix{
  background:white;
}

.livepix-img{
  width:34px;
  height:34px;
  object-fit:contain;
}

/* DISCORD */

.discord{
  background:#5865F2;
}

/* PARCERIAS */

.parceria{
  background:linear-gradient(135deg,#ffcc00,#ff7b00);
}

/* TEXTO */

.card span{
  font-size:15px;
  font-weight:500;
}

/* RESPONSIVO */

@media(max-width:480px){

  body{
    align-items:flex-start;
    padding-top:40px;
    padding-bottom:40px;
  }

  .container{
    width:100%;
  }

  .profile h1{
    font-size:34px;
  }

  .profile p{
    font-size:13px;
  }

  .avatar{
    width:105px;
    height:105px;
  }

  .card{
    padding:14px;
    border-radius:18px;
  }

  .icon-box{
    width:52px;
    height:52px;
  }

  .icon{
    font-size:22px;
  }

  .card span{
    font-size:14px;
  }

}

</style>

</head>
